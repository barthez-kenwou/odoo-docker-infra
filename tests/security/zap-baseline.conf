# OWASP ZAP baseline scan rule overrides.
# Format: <rule id>	<threshold: IGNORE|WARN|FAIL>	<comment>
#
# Odoo's backend intentionally sets some cookies without exhaustive same-site
# hardening on legacy long-polling paths; tracked, not blocking, until we can
# validate no functional regression. Everything else is FAIL by default
# (ZAP baseline default), which is what actually gates the pipeline.
10015	WARN	Re-examine Cache-Control on static assets (Odoo serves web assets with long cache lifetimes by design)
10027	WARN	Information disclosure via debug error messages — re-check once ODOO_LOG_LEVEL=warn is confirmed in production
90005	WARN	Sec-Fetch headers on legacy longpolling endpoint — functional, non-standard by design
