# =============================================================================
# SOPS configuration. Encryption key is `age` (modern, simple, no GPG
# keyring/agent hassle, first-class SOPS support). Rules match by path so
# `sops -e` / `sops -d` need no extra flags once this file is at the repo
# root context SOPS searches from.
# =============================================================================
creation_rules:
  - path_regex: envs/staging\.env(\.enc)?$
    age: >-
      age1REPLACE_WITH_STAGING_RECIPIENT_PUBLIC_KEY
  - path_regex: envs/production\.env(\.enc)?$
    age: >-
      age1REPLACE_WITH_PRODUCTION_RECIPIENT_PUBLIC_KEY
  - path_regex: terraform/environments/(staging|production)\.tfvars\.enc$
    age: >-
      age1REPLACE_WITH_INFRA_RECIPIENT_PUBLIC_KEY
