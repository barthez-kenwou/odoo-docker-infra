# =============================================================================
# Hardened pg_hba.conf
#   - No `trust` method anywhere.
#   - Only the Docker "database" network's fixed subnet (172.28.2.0/24,
#     declared in terraform/modules/network/main.tf — keep these in sync,
#     see docs/security/hardening-checklist.md) may connect.
#   - Local Unix-socket connections (used by pg_isready/healthcheck and
#     maintenance scripts run via `docker compose exec`) use peer auth.
# =============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     scram-sha-256
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             172.28.2.0/24            scram-sha-256
# Everything else is implicitly rejected (no catch-all "0.0.0.0/0" line).
