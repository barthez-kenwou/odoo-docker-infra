# =============================================================================
# PostgreSQL configuration — hardened + tuned baseline for a small/medium
# Odoo instance. Values are conservative defaults meant for a lab VM; see
# docs/runbooks/troubleshooting.md for guidance on re-tuning for real load
# (e.g. via PGTune) before treating these as production-final.
# =============================================================================

# --- Connections & authentication ---
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256

# --- TLS ---
# Disabled by default because Postgres never leaves the isolated "database"
# Docker network in this lab topology (same-host, kernel-routed traffic).
# If Postgres is ever split onto its own host/VM ("architecture distante"),
# set ssl = on and provide ssl_cert_file/ssl_key_file — see
# docs/adr/0002-docker-compose-over-kubernetes-for-mvp.md for the topology
# assumptions this default relies on.
ssl = off

# --- Memory (assumes a ~2 vCPU / 4GB lab node; halve/double as needed) ---
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Write-ahead log / durability / PITR ---
wal_level = replica
archive_mode = on
# Archived WAL segments feed the PITR restore path documented in
# docs/runbooks/disaster-recovery.md and are shipped off-box by
# scripts/backup/backup_postgres.sh via restic.
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- Autovacuum: tuned to run more proactively than stock defaults ---
autovacuum = on
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_naptime = 30s

# --- Logging (slow query + connection audit trail feeding Loki) ---
logging_collector = off        # container stdout is the log sink; Promtail scrapes it
log_destination = 'stderr'
log_min_duration_statement = 500        # ms — flag slow queries for the "index monitoring" item
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] user=%u,db=%d,app=%a,client=%h '

# --- Stats for the postgres-exporter (Prometheus) ---
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
