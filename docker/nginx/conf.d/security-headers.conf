# =============================================================================
# Security headers snippet — included from every real server block.
# =============================================================================
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
# Odoo's web client needs 'unsafe-inline'/'unsafe-eval' for some legacy JS and
# loads its own assets same-origin; this CSP is intentionally the strictest
# baseline that doesn't break the backend UI. Tighten further if you only use
# specific Odoo apps (see docs/security/hardening-checklist.md).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; frame-ancestors 'self'" always;
add_header X-Request-Id $request_id_final always;
