# =============================================================================
# Main Nginx configuration.
# =============================================================================
user nginx;
# Autotune worker count; each worker gets its own connection limit below.
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Structured, correlatable access log ---
    # $request_id ties an Nginx access-log line to the same request's Odoo
    # log line and to the trace exported to Tempo (see monitoring/otel).
    log_format correlated escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /dev/stdout correlated;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --- Hardening ---
    server_tokens off;                # don't advertise the Nginx version
    client_max_body_size 128m;        # generous but bounded upload size (Odoo attachments)
    client_body_timeout 12s;
    client_header_timeout 12s;
    large_client_header_buffers 4 16k;

    # Unique per-request id, propagated to Odoo and into logs/traces.
    map $http_x_request_id $request_id_final {
        default   $request_id;
        "~.+"     $http_x_request_id;
    }

    # --- Rate limiting zones ---
    # General traffic: 10 req/s/IP with a small burst; login endpoint is
    # stricter to blunt credential-stuffing / brute force attempts.
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Blue/green active upstream — rewritten by scripts/deploy/deploy.sh,
    # reloaded with `nginx -s reload` (zero downtime, no image rebuild).
    include /etc/nginx/active/active_upstream.conf;

    include /etc/nginx/conf.d/*.conf;
}
