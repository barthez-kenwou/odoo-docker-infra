# =============================================================================
# Promtail — tails every container's JSON log file via the Docker socket
# service discovery, so every service that was already logging to stdout
# (Nginx, Odoo, Postgres, PgBouncer) is centralized automatically with zero
# per-service configuration.
# =============================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container_name
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: log_stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_label_environment"]
        target_label: environment

  # Host-level auth/security logs (SSH, sudo, fail2ban) — only meaningful
  # when Promtail runs on the actual VM host rather than purely against the
  # Docker socket; see ansible/roles/hardening for where these files live.
  - job_name: auditd
    static_configs:
      - targets: ["localhost"]
        labels:
          job: auditd
          __path__: /var/log/host/audit/audit.log

  - job_name: fail2ban
    static_configs:
      - targets: ["localhost"]
        labels:
          job: fail2ban
          __path__: /var/log/host/fail2ban.log
