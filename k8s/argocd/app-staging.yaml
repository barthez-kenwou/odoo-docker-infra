apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: odoo-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/odoo-devsecops-lab.git
    targetRevision: develop
    path: k8s/helm/odoo
    helm:
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: odoo-staging
  syncPolicy:
    automated:
      prune: true      # remove resources that were deleted from Git
      selfHeal: true    # revert manual `kubectl edit` drift automatically
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
