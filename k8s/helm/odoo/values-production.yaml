replicaCount: 3
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
ingress:
  host: odoo.example.com
  certManagerIssuer: letsencrypt-prod
externalSecret:
  enabled: true
  remoteRefKey: "secret/data/odoo-lab/production"
odoo:
  logLevel: warn
  listDb: "False"
