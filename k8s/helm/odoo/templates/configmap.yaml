apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo.fullname" . }}-config
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
data:
  ODOO_WORKERS: {{ .Values.odoo.workers | quote }}
  ODOO_LOG_LEVEL: {{ .Values.odoo.logLevel | quote }}
  ODOO_LIST_DB: {{ .Values.odoo.listDb | quote }}
  ODOO_DB_HOST: {{ .Values.postgresql.host | quote }}
  ODOO_DB_PORT: {{ .Values.postgresql.port | quote }}
  ODOO_DB_NAME: {{ .Values.postgresql.database | quote }}
  ODOO_PROXY_MODE: "True"
