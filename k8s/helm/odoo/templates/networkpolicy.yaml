{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "odoo.fullname" . }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "odoo.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # Only the Ingress controller's namespace may reach Odoo directly.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8069
          protocol: TCP
        - port: 8072
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Postgres/PgBouncer
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: {{ .Values.postgresql.port }}
          protocol: TCP
    # HTTPS egress (SMTP relay APIs, license checks, etc.) — tighten to exact
    # destination CIDRs once known; left broad here as the documented default.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]   # never let pods reach the cloud metadata endpoint
      ports:
        - port: 443
          protocol: TCP
{{- end }}
