{{- if .Values.externalSecret.enabled }}
# Requires the External Secrets Operator (https://external-secrets.io) and a
# configured ClusterSecretStore pointing at Vault/Infisical/AWS Secrets
# Manager/etc. This is the Kubernetes-native equivalent of this repo's
# SOPS-based secrets workflow (see secrets/README.md) — same principle
# (secrets never live as plain YAML in Git), different mechanism.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgresql.existingSecret }}
  labels:
    {{- include "odoo.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.postgresql.existingSecret }}
    creationPolicy: Owner
  data:
    - secretKey: ODOO_DB_USER
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefKey }}
        property: db_user
    - secretKey: ODOO_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefKey }}
        property: db_password
    - secretKey: ODOO_ADMIN_PASSWD
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefKey }}
        property: admin_password
{{- end }}
